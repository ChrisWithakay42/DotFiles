# ~/.config/alacritty/alacritty.toml
[env]
# TERM variable
# For programs running *directly* in Alacritty (before tmux starts),
# "alacritty" is good if terminfo is installed.
# If you face issues, "xterm-256color" is a safe fallback.
# Tmux will set its own TERM variable (e.g., screen-256color or tmux-256color)
# for shells running inside it.
TERM = "alacritty"

[terminal.shell]
program = "/bin/zsh"
args = ["--login", "-c", "/opt/homebrew/bin/tmux attach || /opt/homebrew/bin/tmux"]

[window]
decorations = "Buttonless" # Your preference
opacity = 0.85             # Your preference
# blur = true              # Uncomment if you want background blur (macOS only)

# Padding:
# dynamic_padding = true   # You have this, it adjusts padding based on content.
# If you want consistent padding, you can disable dynamic_padding and use:
padding = { x = 8, y = 8 } # Adjust to your liking for a "softer" feel

# You can also combine dynamic_padding with a base padding
# dynamic_padding = true
# padding = { x = 5, y = 5 }


[scrolling]
history = 10000
multiplier = 3

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
bold_italic = { family = "JetBrainsMono Nerd Font", style = "Bold Italic" }
size = 12.0 # Your preference

# For macOS, this can improve font rendering, especially for Nerd Fonts
# use_thin_strokes = true

# If you have issues with some icons/glyphs being slightly misaligned:
# [font.glyph_offset]
# x = 0
# y = 0 # Try adjusting this by 1 or -1 if icons are too high/low

# Gruvbox Dark theme for Alacritty
# Sourced from https://github.com/alacritty/alacritty-theme/blob/master/themes/gruvbox_dark.toml
# (or similar Gruvbox implementations)

[colors.primary]
background = "#282828"
foreground = "#ebdbb2"

[colors.cursor]
text = "#282828"
cursor = "#ebdbb2"

[colors.vi_mode_cursor]
text = "#282828"
cursor = "#ebdbb2"

[colors.selection]
text = "CellForeground"
background = "#665c54"

[colors.search.matches]
foreground = "CellBackground"
background = "#a89984"

[colors.search.focused_match]
foreground = "CellBackground"
background = "#fe8019"

[colors.footer_bar]
background = "#282828"
foreground = "#ebdbb2"

[colors.hints.start]
foreground = "#282828"
background = "#d8a657" # Using a Gruvbox yellow/gold

[colors.hints.end]
foreground = "#282828"
background = "#a89984" # Using a Gruvbox neutral

[colors.normal]
black = "#282828"
red = "#cc241d"
green = "#98971a"
yellow = "#d79921"
blue = "#458588"
magenta = "#b16286"
cyan = "#689d6a"
white = "#a89984"

[colors.bright]
black = "#928374"
red = "#fb4934"
green = "#b8bb26"
yellow = "#fabd2f"
blue = "#83a598"
magenta = "#d3869b"
cyan = "#8ec07c"
white = "#ebdbb2"

# Setting this to true makes bold text use the bright variant of colors.
# Useful for themes where bold is not just a weight change but also a color change.
# draw_bold_text_with_bright_colors = true


# macOS specific settings
[keyboard]
# This makes Option key behave as Alt, common for terminal shortcuts
# macos_option_as_alt = true

# Example: map Cmd+C to copy, Cmd+V to paste
# These are often default on macOS but can be explicitly set.
[[keyboard.bindings]]
key = "C"
mods = "Command"
action = "Copy"

[[keyboard.bindings]]
key = "V"
mods = "Command"
action = "Paste"

# You can add more keybindings here if needed
# e.g., for font resizing, new window, etc.
# [[keyboard.bindings]]
# key = "Equals"
# mods = "Command"
# action = "IncreaseFontSize"

# [[keyboard.bindings]]
# key = "Minus"
# mods = "Command"
# action = "DecreaseFontSize"

# [[keyboard.bindings]]
# key = "Key0"
# mods = "Command"
# action = "ResetFontSize"
