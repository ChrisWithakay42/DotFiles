# ==============================================================================
# AeroSpace — i3-style, vim-inspired, ONE modifier.
#
#   hyper        = hold Tab           -> Karabiner emits ctrl-alt-shift-cmd
#   hyper+shift  = hold Tab + Shift   -> Karabiner emits ctrl-alt-cmd
#
# So "hyper+h" focuses left and "hyper+shift+h" moves the window left,
# exactly like i3's $mod / $mod+Shift. Plain hjkl never leaves vim or tmux.
# ==============================================================================
config-version = 2
start-at-login = true
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
accordion-padding = 30

# Mouse follows focus across screens
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
on-focus-changed = ['move-mouse window-lazy-center']

# Workspaces 6 and 7 (two apps each) default to accordion; rooms with 3+ apps
# stay tiles. AeroSpace has no per-workspace
# default layout, so this fires on every switch into those rooms. Harmless:
# they are always accordion. Errors on an empty workspace are ignored.
exec-on-workspace-change = [
  '/bin/bash', '-c',
  'case "$AEROSPACE_FOCUSED_WORKSPACE" in 6|7) aerospace layout accordion horizontal 2>/dev/null ;; esac'
]

# Focus border. Enable after: brew install FelixKratz/formulae/borders
# after-startup-command = ['exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0']

[gaps]
inner.horizontal = 8
inner.vertical   = 8
outer.left   = 8
outer.right  = 8
outer.top    = 8
outer.bottom = 8

# ------------------------------------------------------------------------------
# Workspaces, grouped by task and by what each screen is good at:
#   1 dev (Ghostty)                   built-in, sharpest text
#   2 browsers (Zen, Arc, DDG/Chrome) built-in
#   3 comms (mail, Discord, Claude)   built-in, tiles
#   4 Windows App                     27" 1080p, native resolution
#   5 spare                           27"
#   6 notes (Obsidian, Notes)         iPad, accordion
#   7 planning (Calendar, Reminders)  iPad, accordion
# Arrays are fallback order, so undocking needs no thought.
# Portrait screen: run `aerospace list-monitors` and put its name first in the
# list for 3 or 7, e.g. 3 = ['<portrait name>', 'Built-in Retina Display'].
# ------------------------------------------------------------------------------
[workspace-to-monitor-force-assignment]
1 = 'Built-in Retina Display'
2 = 'Built-in Retina Display'
3 = 'Built-in Retina Display'
4 = ['C27F390', 'main']
5 = ['C27F390', 'main']
6 = ['Sidecar Display (AirPlay)', 'C27F390', 'main']
7 = ['Sidecar Display (AirPlay)', 'C27F390', 'main']

# ------------------------------------------------------------------------------
# Floating: utility / settings windows are never tiled.
# ------------------------------------------------------------------------------
[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.cloudflare.1dot1dot1dot1.macos'   # WARP
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.twingate.macos'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.raycast.macos'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'org.keepassxc.keepassxc'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.ActivityMonitor'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.calculator'
run = 'layout floating'

[[on-window-detected]]
if.window-title-regex-substring = 'Settings|Preferences'
run = 'layout floating'

# ------------------------------------------------------------------------------
# Routing
# ------------------------------------------------------------------------------
# 1 dev
[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = 'move-node-to-workspace 1'

# 2 browsers
[[on-window-detected]]
if.app-id = 'company.thebrowser.Browser'            # Arc
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'app.zen-browser.zen'                 # Zen
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'com.duckduckgo.macos.browser'          # throwaway browser
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'com.google.Chrome'                     # if DDG is swapped for Chrome
run = 'move-node-to-workspace 2'

# 3 comms
[[on-window-detected]]
if.app-id = 'com.mimestream.Mimestream'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'com.hnc.Discord'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'com.anthropic.claudefordesktop'
run = 'move-node-to-workspace 3'

# 4 Windows
[[on-window-detected]]
if.app-id = 'com.microsoft.rdc.macos'               # Windows App
run = 'move-node-to-workspace 4'

# 6 notes
[[on-window-detected]]
if.app-id = 'md.obsidian'
run = 'move-node-to-workspace 6'

[[on-window-detected]]
if.app-id = 'com.apple.Notes'
run = 'move-node-to-workspace 6'

# 7 planning
[[on-window-detected]]
if.app-id = 'com.apple.iCal'                        # Calendar
run = 'move-node-to-workspace 7'

[[on-window-detected]]
if.app-id = 'com.apple.reminders'
run = 'move-node-to-workspace 7'

# ------------------------------------------------------------------------------
# Bindings.  H = hyper (ctrl-alt-shift-cmd).  HS = hyper+shift (ctrl-alt-cmd).
# Left column is what your fingers do; right column is the i3 equivalent.
# ------------------------------------------------------------------------------
[mode.main.binding]
# focus                                              $mod+h/j/k/l
ctrl-alt-shift-cmd-h = 'focus left  --boundaries all-monitors-outer-frame --boundaries-action wrap-around-all-monitors'
ctrl-alt-shift-cmd-j = 'focus down  --boundaries all-monitors-outer-frame --boundaries-action wrap-around-all-monitors'
ctrl-alt-shift-cmd-k = 'focus up    --boundaries all-monitors-outer-frame --boundaries-action wrap-around-all-monitors'
ctrl-alt-shift-cmd-l = 'focus right --boundaries all-monitors-outer-frame --boundaries-action wrap-around-all-monitors'
# move                                               $mod+Shift+h/j/k/l
ctrl-alt-cmd-h = 'move left'
ctrl-alt-cmd-j = 'move down'
ctrl-alt-cmd-k = 'move up'
ctrl-alt-cmd-l = 'move right'

# workspaces                                         $mod+N
ctrl-alt-shift-cmd-1 = 'workspace 1'
ctrl-alt-shift-cmd-2 = 'workspace 2'
ctrl-alt-shift-cmd-3 = 'workspace 3'
ctrl-alt-shift-cmd-4 = 'workspace 4'
ctrl-alt-shift-cmd-5 = 'workspace 5'
ctrl-alt-shift-cmd-6 = 'workspace 6'
ctrl-alt-shift-cmd-7 = 'workspace 7'
ctrl-alt-shift-cmd-8 = 'workspace 8'
# send window to workspace                           $mod+Shift+N
ctrl-alt-cmd-1 = 'move-node-to-workspace 1'
ctrl-alt-cmd-2 = 'move-node-to-workspace 2'
ctrl-alt-cmd-3 = 'move-node-to-workspace 3'
ctrl-alt-cmd-4 = 'move-node-to-workspace 4'
ctrl-alt-cmd-5 = 'move-node-to-workspace 5'
ctrl-alt-cmd-6 = 'move-node-to-workspace 6'
ctrl-alt-cmd-7 = 'move-node-to-workspace 7'
ctrl-alt-cmd-8 = 'move-node-to-workspace 8'
ctrl-alt-shift-cmd-b = 'workspace-back-and-forth'     # back to previous workspace
ctrl-alt-shift-cmd-o = 'focus-back-and-forth'         # back to previous window ("other")

# monitors
ctrl-alt-shift-cmd-comma  = 'focus-monitor --wrap-around prev'
ctrl-alt-shift-cmd-period = 'focus-monitor --wrap-around next'
ctrl-alt-cmd-comma  = 'move-node-to-monitor --focus-follows-window --wrap-around prev'
ctrl-alt-cmd-period = 'move-node-to-monitor --focus-follows-window --wrap-around next'
ctrl-alt-cmd-n      = 'move-workspace-to-monitor --wrap-around next'   # push whole workspace to next screen

# layout                                             $mod+e / $mod+s / $mod+w
ctrl-alt-shift-cmd-e = 'layout tiles horizontal vertical'
ctrl-alt-shift-cmd-s = 'layout accordion horizontal vertical'
ctrl-alt-shift-cmd-w = 'layout accordion horizontal vertical'
ctrl-alt-shift-cmd-enter = 'fullscreen'               # $mod+f (f is Shortcat)
ctrl-alt-cmd-enter = 'layout floating tiling'          # $mod+Shift+space
ctrl-alt-cmd-q = 'close'                               # $mod+Shift+q
ctrl-alt-shift-cmd-r = 'mode resize'                   # $mod+r
ctrl-alt-shift-cmd-0 = 'balance-sizes'
ctrl-alt-shift-cmd-minus = 'resize smart -60'
ctrl-alt-shift-cmd-equal = 'resize smart +60'
ctrl-alt-cmd-c = 'reload-config'                       # $mod+Shift+c
ctrl-alt-shift-cmd-semicolon = 'mode service'

[mode.resize.binding]
h = 'resize width -60'
j = 'resize height +60'
k = 'resize height -60'
l = 'resize width +60'
b = 'balance-sizes'
enter = 'mode main'
esc = 'mode main'

[mode.service.binding]
esc       = ['reload-config', 'mode main']
r         = ['flatten-workspace-tree', 'mode main']   # un-mess the tree
f         = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']
h = ['join-with left',  'mode main']
j = ['join-with down',  'mode main']
k = ['join-with up',    'mode main']
l = ['join-with right', 'mode main']
